[project]
name = "claude-show-context"
version = "0.1.0"
description = "A CLI tool that displays a colored terminal bar showing Claude Code context window usage."
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
claude-show-context = "claude_show_context.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_show_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=claude_show_context --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["claude_show_context"]
omit = ["src/claude_show_context/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
